<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
    }

    .video-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: 0;
    }

    #title {
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
    }

    #date {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.65;
    }

    #loading {
      padding: 40px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="video-container">

    <div id="loading">
      Loading latest exploration...
    </div>

    <div id="video-content" style="display:none;">

      <div class="video-wrapper">
        <iframe
          id="video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div id="title"></div>
      <div id="date"></div>

    </div>

  </div>

  <script>
    const API_KEY = "AIzaSyDOgyisBnK1W1nJVe9xPl6GefcJuCng2CU";
    const CHANNEL_ID = "UC7YEmpVvPAJm-NswOTuUZ-Q";

    const url =
      `https://www.googleapis.com/youtube/v3/search` +
      `?part=snippet` +
      `&channelId=${CHANNEL_ID}` +
      `&maxResults=1` +
      `&order=date` +
      `&type=video` +
      `&key=${API_KEY}`;

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error("YouTube API request failed");
        }

        return response.json();
      })

      .then(data => {

        if (!data.items || data.items.length === 0) {
          throw new Error("No videos found");
        }

        const latest = data.items[0];

        const videoId = latest.id.videoId;
        const title = latest.snippet.title;
        const published = new Date(latest.snippet.publishedAt);

        document.getElementById("video").src =
          `https://www.youtube.com/embed/${videoId}`;

        document.getElementById("title").textContent = title;

        document.getElementById("date").textContent =
          "Published " +
          published.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric"
          });

        document.getElementById("loading").style.display = "none";
        document.getElementById("video-content").style.display = "block";

      })

      .catch(error => {

        console.error(error);

        document.getElementById("loading").textContent =
          "Unable to load latest video.";

      });
  </script>

</body>
</html>
